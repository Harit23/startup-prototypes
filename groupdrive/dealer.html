<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GroupDrive — Dealer | Group buying for every vehicle</title>
<link rel="stylesheet" href="style.css?v=16">
<script src="../vendor/supabase.js"></script>
<script src="../vendor/config.js"></script>
<script src="app.js?v=16"></script>
<script src="vehicles.js?v=16"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">Group<b>Drive</b></a><span class="muted">Dealer</span><span class="sp"></span>
  <span id="modeBadge" class="badge"></span>
</header>
<main>
  <div id="app">
    <p class="note">Lowest price wins. The group buys from the winning dealer.</p>
    <p class="small">Your area: <b id="me"></b> · <a href="#" id="change">Change area</a></p>
    <p><label for="dName" class="small">Your name (just for display, optional)</label><input id="dName" maxlength="30" placeholder="e.g. Rakesh"></p>
    <div id="live"></div>
    <h2 id="closedH" hidden>Recently closed</h2>
    <div id="closed"></div>
  </div>
</main>
<script>
/* Dealer page logic (mobile first) */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = GD.esc, fmt = GD.fmt;
  const KEY = 'gd_dealer';
  const AREAS = ['Satellite', 'SG Highway', 'Prahlad Nagar', 'Bopal', 'Navrangpura', 'Vastrapur', 'Maninagar', 'Thaltej', 'Bodakdev', 'Chandkheda'];
  const pickArea = (not) => { const l = AREAS.filter((x) => x !== not); return l[Math.floor(Math.random() * l.length)]; };
  let dealer = null, auctions = [], bids = [], dispName = localStorage.getItem(KEY + '_name') || '';

  // No setup form: silently auto-assign a random area on first visit.
  async function ensureDealer() {
    try { dealer = JSON.parse(localStorage.getItem(KEY)); } catch (e) { dealer = null; }
    if (dealer && dealer.id && dealer.area) return;
    const area = pickArea();
    if (dealer && dealer.id) { dealer.area = area; }       // old format: keep id, add area
    else {
      const row = await GD.registerDealer({ name: 'Dealer ' + area, brand: 'Any', area });
      dealer = { id: row.id, area };
    }
    localStorage.setItem(KEY, JSON.stringify(dealer));
  }
  const labelFor = (a) => a.brand + ' Dealer ' + dealer.area + (dispName ? ' (' + dispName + ')' : '');
  function show() { $('me').textContent = dealer.area; }
  $('dName').value = dispName;
  $('dName').oninput = () => { dispName = $('dName').value.trim(); localStorage.setItem(KEY + '_name', dispName); render(); };
  $('change').onclick = (e) => {
    e.preventDefault();
    dealer.area = pickArea(dealer.area);
    localStorage.setItem(KEY, JSON.stringify(dealer)); show(); render();
    GD.toast('Area changed to ' + dealer.area, 'ok');
  };

  // ---------- Data ----------
  async function refresh() {
    if (!dealer) return;
    try { [auctions, bids] = await Promise.all([GD.listAuctions(), GD.listBids()]); render(); }
    catch (err) { console.error(err); }
  }
  const myBid = (aid) => bids.find((b) => b.auction_id === aid && b.dealer_id === dealer.id);
  const bidsFor = (aid) => bids.filter((b) => b.auction_id === aid);

  // ---------- Render ----------
  function liveCard(a) {
    const act = GD.ranked(bidsFor(a.id)), mine = myBid(a.id);
    const top = act[0];
    const rankIdx = mine && mine.status === 'active' ? act.findIndex((b) => b.dealer_id === dealer.id) : -1;
    let body;
    if (!mine) {
      body = '<button class="btn block" data-act="join" data-id="' + a.id + '">Join bidding</button>' +
        '<p class="small muted">Opening bid: ' + fmt(Math.max(1, (top ? Number(top.amount) : Number(a.base_price)) - 10000)) + '</p>';
    } else if (mine.status === 'out') {
      body = '<div class="result lost">You left this deal</div><p><button class="btn block" data-act="rejoin" data-id="' + a.id + '">Rejoin</button></p>';
    } else {
      const d = (amt, label, wide) => '<button class="btn dn' + (wide ? ' wide' : '') + '" data-act="delta" data-id="' + a.id + '" data-d="-' + amt + '">' + label + '</button>';
      body = '<div class="stats"><div class="stat"><div class="k">Your bid</div><div class="v">' + fmt(mine.amount) + '</div></div>' +
        '<div class="stat"><div class="k">Your rank</div><div class="v"><span class="rank' + (rankIdx === 0 ? ' first' : '') + '">#' + (rankIdx + 1) + '</span></div></div></div>' +
        '<div class="small muted">Lower your price = better offer</div><div class="bidgrid">' +
        d(10000, '− ₹10,000') + d(50000, '− ₹50,000') + d(100000, '− ₹1,00,000', true) + '</div>' +
        '<div class="small muted">Or type your price (starts at your ongoing bid)</div>' +
        '<div class="custom"><input class="cust" id="cust-' + a.id + '" type="number" inputmode="numeric"' +
        ' value="' + mine.amount + '" data-auto="' + mine.amount + '" placeholder="Your price (₹)">' +
        '<button class="btn" data-act="custom" data-id="' + a.id + '">Place</button></div>' +
        '<p><button class="btn red block" data-act="out" data-id="' + a.id + '">Get out of this deal</button></p>';
    }
    return '<div class="card" data-card="' + a.id + '"><div class="auc-head">' + GDV.thumb(a) + '<div class="auc-t"><h3>' + esc(a.brand + ' ' + a.model) + '</h3>' +
      '<div class="tags"><span class="tag">' + esc(a.city) + '</span><span class="tag">Group of ' + a.group_size + '</span><span class="tag">' +
      esc(a.payment_terms || '—') + '</span></div></div><div class="timer" data-ends="' + esc(a.ends_at || '') + '">' + GD.countdown(a.ends_at) + '</div></div>' +
      '<div class="small muted bidas">You are bidding as: <b>' + esc(labelFor(a)) + '</b></div>' +
      '<div class="stats"><div class="stat big"><div class="k">Current lowest bid</div><div class="v">' + (top ? fmt(top.amount) : '—') + '</div>' +
      '<div class="small">' + (top ? 'Held by ' + esc(top.dealer_label) + (rankIdx === 0 ? ' (you)' : '') : 'No bids yet') + '</div></div>' +
      '<div class="stat"><div class="k">Base price</div><div class="v">' + fmt(a.base_price) + '</div></div></div>' + body + '</div>';
  }

  function closedCard(a) {
    const act = GD.ranked(bidsFor(a.id)), mine = myBid(a.id);
    let res;
    if (a.status === 'cancelled') res = '<div class="result lost">Auction cancelled</div>';
    else if (a.winner_amount == null) res = '<div class="result lost">Closed with no bids</div>';
    else if (act[0] && act[0].dealer_id === dealer.id) res = '<div class="result">You won! 🎉<br>' + fmt(a.winner_amount) + '</div>';
    else res = '<div class="result lost">Winner: ' + esc(a.winner_label) + ' at ' + fmt(a.winner_amount) +
      (mine ? '<br><span class="small muted">Your last bid: ' + fmt(mine.amount) + '</span>' : '') + '</div>';
    return '<div class="card"><div class="auc-head">' + GDV.thumb(a) + '<div class="auc-t"><h3>' + esc(a.brand + ' ' + a.model) + '</h3><div class="tags"><span class="tag">' + esc(a.city) +
      '</span><span class="tag">Group of ' + a.group_size + '</span></div></div></div>' + res + '</div>';
  }

  function render() {
    // preserve custom input value + focus across re-render
    const ae = document.activeElement;
    const keepId = ae && ae.classList && ae.classList.contains('cust') ? ae.id : null;
    const keepVal = keepId ? ae.value : null;
    // Only keep a value the dealer actually typed; an untouched box follows the ongoing bid.
    const vals = {}; document.querySelectorAll('.cust').forEach((i) => { if (i.value && i.value !== i.dataset.auto) vals[i.id] = i.value; });

    const live = auctions.filter((a) => a.status === 'live');
    $('live').innerHTML = live.length ? live.map(liveCard).join('') :
      '<div class="card muted">No live auctions right now. This page updates automatically.</div>';
    const done = auctions.filter((a) => a.status !== 'live').slice(0, 5);
    $('closedH').hidden = !done.length;
    $('closed').innerHTML = done.map(closedCard).join('');

    Object.keys(vals).forEach((id) => { if ($(id)) $(id).value = vals[id]; });
    if (keepId && $(keepId)) $(keepId).focus();
  }

  // ---------- Bidding ----------
  async function put(a, amount, status) {
    try {
      await GD.placeBid(a.id, dealer.id, labelFor(a), amount, status);
      await refresh();
    } catch (err) { GD.toast('Bid failed: ' + (err.message || err), 'err'); }
  }
  function validate(a, amount) {
    if (!(amount > 0)) { GD.toast('Bid must be more than ₹0', 'err'); return false; }
    if (amount > Number(a.base_price)) { GD.toast('Bid cannot be above the base price ' + fmt(a.base_price), 'err'); return false; }
    return true;
  }

  $('live').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    await refresh(); // use freshest data
    const a = auctions.find((x) => x.id === btn.dataset.id);
    if (!a || a.status !== 'live') return GD.toast('This auction has ended', 'err');
    const mine = myBid(a.id), act = btn.dataset.act;
    if (act === 'join') {
      const top = GD.ranked(bidsFor(a.id))[0];
      const amt = (top ? Number(top.amount) : Number(a.base_price)) - 10000;
      if (validate(a, amt)) put(a, amt, 'active');
    } else if (act === 'rejoin') {
      put(a, mine ? mine.amount : a.base_price, 'active');
    } else if (act === 'delta') {
      const amt = Number(mine.amount) + Number(btn.dataset.d);
      if (validate(a, amt)) put(a, amt, 'active');
    } else if (act === 'custom') {
      const raw = $('cust-' + a.id).value;
      if (raw === '' || isNaN(Number(raw))) return GD.toast('Enter an amount', 'err');
      const amt = Math.round(Number(raw));
      if (validate(a, amt)) { put(a, amt, 'active'); const box = $('cust-' + a.id); if (box) { box.value = amt; box.dataset.auto = amt; } }
    } else if (act === 'out') {
      if (confirm('Leave this deal? You can rejoin later.')) put(a, mine.amount, 'out');
    }
  });

  setInterval(() => {
    document.querySelectorAll('.timer[data-ends]').forEach((el) => {
      const ends = el.dataset.ends;
      el.textContent = GD.countdown(ends || null);
      el.classList.toggle('low', !!ends && new Date(ends) - Date.now() < 30000);
    });
  }, 1000);

  GD.init().then(async () => {
    try { await ensureDealer(); } catch (err) { GD.toast('Could not register: ' + (err.message || err), 'err'); return; }
    show(); refresh(); GD.subscribe(refresh);
  });
})();
</script>
</body>
</html>

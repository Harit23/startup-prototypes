<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f31">
<title>PawPulse app demo (concept, sample data)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbfaf6;--paper:#f6f3ea;--mint:#eaf5ef;--mint2:#d7ecdf;--green:#1d6b50;--deep:#123f31;--amber:#f2a65a;--terra:#d9733a;--terra-text:#a64f1d;--ink:#1d2b25;--muted:#54635b;--line:#e2e8e2;--white:#fff;--danger:#b3402a;--blue:#2f6f8f;
--display:'Fraunces',Georgia,'Times New Roman',serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
--shadow:0 1px 2px rgba(18,63,49,.06),0 12px 32px -14px rgba(18,63,49,.22);--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--cream);font-size:15px;line-height:1.45;overflow:hidden}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.15;letter-spacing:-.01em;margin:0 0 8px;color:var(--deep)}
p{margin:0 0 8px}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
.dk :focus-visible{outline-color:#fff}
[hidden]{display:none!important}
input[type=range]{accent-color:var(--green);width:100%;min-height:32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.small{font-size:.82rem;color:var(--muted)}.mut{color:var(--muted)}
/* frame */
.stage{height:100%;display:grid;place-items:center}
.app{position:relative;width:100%;max-width:430px;height:100%;background:var(--cream);display:flex;flex-direction:column;overflow:hidden;isolation:isolate;overflow:clip}
@media(min-width:700px){body{background:radial-gradient(1200px 600px at 20% 0,#d7ecdf 0,#eef4ee 45%,#f6f3ea 100%)}
.app{height:min(860px,calc(100vh - 32px));border-radius:46px;border:10px solid #14201b;box-shadow:0 40px 80px -30px rgba(18,63,49,.5),0 0 0 2px #2b3a33}}
/* header */
.hd{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px;background:var(--cream);flex:none}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;color:var(--deep);font-size:1.15rem}
.brand svg{width:24px;height:26px}
.hd .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px;border-radius:99px;background:var(--mint);color:var(--deep);font-size:.78rem;font-weight:700;border:1px solid var(--mint2);white-space:nowrap}
.chip.amb{background:#fdf0e0;border-color:#f6d9b6;color:#7a3f10}
.chip.red{background:#fbe9e3;border-color:#f1c4b6;color:#8c2f1b}
.chip.dkc{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#2fa36f;display:inline-block;flex:none}
.dot.live{animation:pls 1.8s infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(47,163,111,.55)}100%{box-shadow:0 0 0 8px rgba(47,163,111,0)}}
.ribbon{background:#fdf0e0;color:#7a3f10;font-size:.74rem;font-weight:700;text-align:center;padding:4px 10px;border-block:1px solid #f6d9b6;flex:none;letter-spacing:.01em}
/* panels */
.panels{position:relative;flex:1;min-height:0}
.panel{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .28s var(--ease),transform .28s var(--ease),visibility 0s .28s;scrollbar-width:thin}
.panel.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s var(--ease),transform .28s var(--ease)}
.panel>*{flex:none}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.ph h2{font-size:1.6rem;margin:0}
/* tabbar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(18,63,49,.4)}
.tab{position:relative;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);border-radius:14px;transition:color .2s,background .2s}
.tab[aria-selected=true]{color:var(--deep);background:var(--mint)}
.tab[aria-selected=true] .ic{stroke:var(--green)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--terra-text);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 5px;font-weight:700}
.badge[hidden]{display:none}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:1.1rem;margin:0 0 4px}
.card .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:#fdf0e0;color:#7a3f10;border:1px solid #f6d9b6;vertical-align:middle}
.tag.g{background:var(--mint);color:var(--deep);border-color:var(--mint2)}
.btn{min-height:44px;padding:10px 16px;border-radius:14px;background:var(--green);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}.btn:hover{background:var(--deep)}
.btn.sec{background:var(--mint);color:var(--deep);border:1px solid var(--mint2)}.btn.sec:hover{background:var(--mint2)}
.btn.wh{background:#fff;color:var(--deep)}.btn.warn{background:#fff;color:var(--danger);border:1px solid #f1c4b6}
.btn.sm{min-height:44px;padding:6px 12px;font-size:.88rem}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:.78rem;font-weight:700;color:var(--muted)}
.inp{min-height:44px;border:1.5px solid #c9d6cd;background:#fff;border-radius:12px;padding:8px 12px;width:100%}
textarea.inp{min-height:84px;resize:vertical}
.seg{display:flex;background:var(--mint);border-radius:14px;padding:3px;gap:3px;border:1px solid var(--mint2)}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700;font-size:.88rem;color:var(--muted);padding:4px 6px}
.seg button[aria-pressed=true],.seg button[aria-checked=true]{background:#fff;color:var(--deep);box-shadow:0 1px 4px rgba(18,63,49,.2)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;width:100%;text-align:left}
.sw .tg{width:46px;height:28px;border-radius:14px;background:#b9c6bd;position:relative;flex:none;transition:background .2s}
.sw .tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked=true] .tg{background:var(--green)}.sw[aria-checked=true] .tg:after{transform:translateX(18px)}
.sw[aria-disabled=true]{opacity:.55;cursor:not-allowed}
/* hero */
.hero{background:radial-gradient(120% 90% at 85% 0,#1f7a5b 0,#123f31 62%);color:#fff;border-radius:28px;padding:18px 16px 16px;box-shadow:0 18px 40px -18px rgba(18,63,49,.7);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(242,166,90,.28),transparent 65%)}
.hero .top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hero h2{color:#fff;margin:0;font-size:1.25rem}
.ringwrap{position:relative;width:196px;height:196px;margin:8px auto 4px;z-index:1}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .tr{stroke:rgba(255,255,255,.14)}
.ringwrap .pr{stroke:url(#gr);transition:stroke-dashoffset 1s var(--ease)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc b{font-family:var(--display);font-size:3.4rem;line-height:1;font-weight:700}
.ringc span{font-size:.78rem;color:#cfe8dc;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ringc em{font-style:normal;margin-top:4px;font-size:.7rem;background:rgba(242,166,90,.2);color:#ffd9b0;padding:1px 8px;border-radius:99px;font-weight:700}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;position:relative;z-index:1}
.part{background:rgba(255,255,255,.09);border-radius:14px;padding:8px 10px}
.part small{display:block;color:#cfe8dc;font-size:.7rem;font-weight:700}
.part b{font-size:1.1rem}.part i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:5px;overflow:hidden}
.part i u{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .8s var(--ease)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative;z-index:1}
.tile .k{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:1.9rem;font-weight:700;color:var(--deep);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.tile .v small{font-family:var(--body);font-size:.75rem;font-weight:500;color:var(--muted)}
.bar{height:6px;background:var(--mint2);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .6s var(--ease)}
.pulse{width:100%;height:46px;margin-top:6px;display:block}
.pulse polyline{fill:none;stroke:var(--terra);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.heart{color:var(--terra-text);display:inline-flex}.heart.b{animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.2)}}
/* map */
.map{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#eaf5ef}
.map svg{display:block;width:100%;height:auto}
.map .lock{position:absolute;inset:0;background:rgba(251,250,246,.88);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:8px;font-weight:700;color:var(--deep)}
.map .lock[hidden]{display:none}
.zonering{transition:fill .4s,stroke .4s}
.petdot .halo{transform-box:fill-box;transform-origin:center;animation:halo 1.8s infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.geo{margin-top:12px;padding:12px;border-radius:16px;background:var(--paper);font-size:.88rem}
.geo .out{margin-top:8px;font-variant-numeric:tabular-nums}
/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-height:44px;position:relative;overflow:hidden}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sev,#9db3a6)}
.item.done{opacity:.62}
.sev-high{--sev:var(--danger)}.sev-med{--sev:var(--amber)}.sev-low{--sev:#2fa36f}.sev-info{--sev:var(--blue)}
.ibox{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--mint);color:var(--deep);flex:none}
.sev-high .ibox{background:#fbe9e3;color:var(--danger)}.sev-med .ibox{background:#fdf0e0;color:#7a3f10}.sev-info .ibox{background:#e4f0f6;color:#1f5673}
.item h4{font-family:var(--body);font-size:.95rem;margin:0 0 2px;font-weight:700;color:var(--ink)}
.item p{font-size:.84rem;color:var(--muted);margin:0}
.item .meta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:.74rem;color:var(--muted);font-weight:700}
.sevlab{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:99px;background:#eef2ef;color:var(--ink)}
.sev-high .sevlab{background:#fbe9e3;color:#8c2f1b}.sev-med .sevlab{background:#fdf0e0;color:#7a3f10}.sev-info .sevlab{background:#e4f0f6;color:#1f5673}.sev-low .sevlab{background:var(--mint);color:var(--deep)}
.simrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.simrow::-webkit-scrollbar{display:none}
.simrow .btn{flex:none;font-size:.82rem;padding:6px 12px}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
/* care */
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .tx{flex:1;min-width:0}.crow b{display:block;font-size:.95rem}.crow small{color:var(--muted);font-size:.8rem}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #9db3a6;display:grid;place-items:center;flex:none;color:#fff;transition:all .2s}
.chk .ic{width:16px;height:16px;stroke-width:3;opacity:0}
.crow[aria-checked=true] .chk{background:var(--green);border-color:var(--green)}.crow[aria-checked=true] .chk .ic{opacity:1}
.crow[aria-checked=true] b{text-decoration:line-through;text-decoration-color:rgba(29,107,80,.5)}
.crow.over .chk{border-color:var(--danger)}.crow.over small{color:var(--danger);font-weight:700}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mr{position:relative;width:78px;height:78px;margin:0 auto}
.mr svg{width:100%;height:100%;transform:rotate(-90deg)}.mr .tr{stroke:var(--mint2)}.mr .pr{stroke:var(--green);transition:stroke-dashoffset .7s var(--ease)}
.mr b{position:absolute;inset:0;display:grid;place-items:center;font-size:.95rem}
.rings small{display:block;font-weight:700;font-size:.78rem;margin-top:4px}
.streak{display:flex;align-items:center;gap:10px;background:#fdf0e0;border:1px solid #f6d9b6;border-radius:16px;padding:10px 12px;color:#5c3010;font-weight:700}
.streak b{font-family:var(--display);font-size:1.6rem;color:#7a3f10}
.tl{position:relative;margin:0;padding:0 0 0 22px;list-style:none}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--mint2)}
.tl li{position:relative;padding:0 0 14px}.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--green)}
.tl li.due:before{border-color:var(--terra)}.tl li.plan:before{border-color:#9db3a6}
.tl b{display:block}.tl .d{font-size:.78rem;color:var(--muted);font-weight:700}
/* family */
.mem{padding:12px 0;border-bottom:1px solid var(--line)}.mem:last-child{border-bottom:0}
.mhead{display:flex;gap:10px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--deep);display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:none}
.role{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.r-Owner{background:var(--deep);color:#fff}.r-Family{background:var(--mint);color:var(--deep)}.r-Vet{background:#e4f0f6;color:#1f5673}.r-Walker{background:#fdf0e0;color:#7a3f10}
.perms{margin-top:6px;padding-left:52px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.9rem;letter-spacing:.2em;font-weight:700;color:var(--deep);background:var(--mint);border:2px dashed var(--green);border-radius:16px;text-align:center;padding:10px;margin:10px 0}
/* profile */
.petcard{display:flex;gap:14px;align-items:center}
.pav{width:68px;height:68px;border-radius:22px;background:linear-gradient(145deg,#d7ecdf,#eaf5ef);display:grid;place-items:center;flex:none;border:1px solid var(--mint2)}
.bandcard svg.bd{width:100%;height:auto;display:block;background:var(--mint);border-radius:16px}
.mcards{display:grid;gap:8px;margin-top:10px}
.mc{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff;min-height:44px}
.mc[aria-checked=true]{border-color:var(--green);background:var(--mint)}
.mc b{display:flex;justify-content:space-between;gap:8px}
.mc small{color:var(--muted)}
.note{background:var(--paper);border-radius:14px;padding:10px 12px;font-size:.84rem;color:var(--muted);border:1px solid #ebe4d2}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.hist .d{font-size:.76rem;font-weight:700;color:var(--green)}
.hist .why{font-weight:700;margin:2px 0}
.hist .vs{font-size:.86rem;color:var(--muted)}
.adm{border:2px dashed var(--terra);background:#fff8f1}
.recs{margin:10px 0 0;padding:0;list-style:none;font-size:.86rem}
.recs li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.recs li:last-child{border:0}
/* sheet + toast */
.sheetw{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;visibility:hidden;transition:visibility 0s .3s}
.sheetw.on{visibility:visible;transition:none}
.scrim{position:absolute;inset:0;background:rgba(18,63,49,.5);opacity:0;transition:opacity .3s}
.sheetw.on .scrim{opacity:1}
.sheet{position:relative;width:100%;max-height:86%;overflow-y:auto;background:var(--cream);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .34s var(--ease);box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}
.sheetw.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#c9d6cd;margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.sh-h h3{font-size:1.3rem;margin:0}
.x{width:44px;height:44px;border-radius:50%;background:var(--mint);display:grid;place-items:center;flex:none;margin:-6px -8px 0 0}
pre.json{background:#14201b;color:#d7ecdf;border-radius:14px;padding:12px;font-size:.72rem;line-height:1.5;max-height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:8px 0 12px;tab-size:2}
.toast{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:60;transform:translateY(-140%);transition:transform .45s var(--ease);pointer-events:none}
.toast.on{transform:none;pointer-events:auto}
.toast button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--deep);color:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);min-height:56px;border-left:6px solid var(--amber)}
.toast.sev-high button{border-left-color:#ef7b5f}.toast.sev-info button{border-left-color:#7fc0de}
.toast b{display:block;font-size:.92rem}.toast span.t{font-size:.8rem;color:#cfe8dc;display:block}
.toast .ibox{background:rgba(255,255,255,.14);color:#fff}
.toast.plain button{border-left-color:var(--mint2)}
/* pair */
.pair{position:absolute;inset:0;z-index:80;background:radial-gradient(120% 70% at 80% 0,#1f7a5b 0,#123f31 70%);color:#fff;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow-y:auto;transition:opacity .5s,visibility 0s .5s}
.pair.off{opacity:0;visibility:hidden;pointer-events:none}
.pair h1{color:#fff;font-size:2.1rem;margin:14px 0 4px}
.pair .lg{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.4rem}
.pair .lg svg{width:34px;height:37px;background:#fbfaf6;border-radius:12px;padding:5px}
.steps{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:10px}

 switch(a.type){

 default:return{icon:'cal',title:'Vet follow-up: Leptospirosis booster',body:'Dr. Demo Vet (concept) noted the next booster on 14 Dec 2026. Book a visit with your own vet. This is sample data.'}}}
